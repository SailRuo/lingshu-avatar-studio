[package]
name = "lingshu-avatar-studio"
version = "0.1.0"
description = "Local 2D digital human studio"
authors = ["Avatar Studio"]
edition = "2021"
rust-version = "1.82"

[lib]
name = "lingshu_avatar_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "json", "charset", "http2"] }
bytes = "1"
http = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.40", features = ["bundled", "serde_json"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots", "connect", "handshake"] }
rmp-serde = "1.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
